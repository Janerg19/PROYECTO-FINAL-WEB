<header
    class="bg-slate-900 text-white shadow-lg"
>

    <div
        class="mx-auto flex max-w-7xl
               flex-col gap-4 px-6 py-5 md:flex-row md:items-center md:justify-between"
    >

        <div>

            <h1
                class="text-2xl font-bold"
            >

                Flask Inventory

            </h1>


            <p
                class="text-sm text-slate-400"
            >

                Monolito · REST API · JWT · MySQL

            </p>

        </div>

        <div class="flex flex-wrap items-center gap-3">

            <button
                data-screen="dashboard"
                class="hidden rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-sm font-medium text-slate-100 transition hover:bg-slate-700"
            >
                Dashboard
            </button>

            <button
                data-screen="products"
                class="hidden rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-sm font-medium text-slate-100 transition hover:bg-slate-700"
            >
                Inventario
            </button>

            <button
                data-screen="profile"
                class="hidden rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-sm font-medium text-slate-100 transition hover:bg-slate-700"
            >
                Perfil
            </button>

            <button
                id="logout-button"
                class="hidden rounded-lg
                       bg-red-600 px-4 py-2
                       font-semibold
                       hover:bg-red-700"
            >

                Cerrar sesión

            </button>

        </div>

    </div>

</header>
