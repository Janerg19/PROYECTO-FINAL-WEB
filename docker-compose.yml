version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: riul-db
    environment:
      MYSQL_DATABASE: riul
      MYSQL_USER: riul_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-riul_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riul-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: riul-api
    environment:
      DB_HOST: riul-db
      DB_PORT: 5432
      DB_NAME: riul
      DB_USER: riul_app
      DB_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
      JWT_SECRET: ${JWT_SECRET:-riul_jwt_secret_dev}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - riul-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: riul-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - riul-network

  adminer:
    image: adminer:latest
    container_name: riul-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: riul-db
      ADMINER_DEFAULT_USER: riul_app
      ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
      ADMINER_DEFAULT_DB: riul
    networks:
      - riul-network

volumes:
  mysqldata:

networks:
  riul-network:
    driver: bridge
