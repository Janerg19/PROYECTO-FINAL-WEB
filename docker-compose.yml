version: '3.8'

services:
  db:
    image: postgres:16
    container_name: riul-db
    environment:
      POSTGRES_DB: riul
      POSTGRES_USER: riul_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riul_app -d riul"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riul-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: riul-api
    environment:
      DB_HOST: riul-db
      DB_PORT: 5432
      DB_NAME: riul
      DB_USER: riul_app
      DB_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
      JWT_SECRET: ${JWT_SECRET:-riul_jwt_secret_dev}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - riul-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: riul-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - riul-network

  adminer:
    image: adminer:latest
    container_name: riul-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: riul-db
      ADMINER_DEFAULT_USER: riul_app
      ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD:-riul_dev_password}
      ADMINER_DEFAULT_DB: riul
    networks:
      - riul-network

volumes:
  pgdata:

networks:
  riul-network:
    driver: bridge
